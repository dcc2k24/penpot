# Round-robin balancer for two Penpot MCP adapters (test stack, see README.md).

# One worker, so the round-robin turn is kept in one place and requests
# alternate between the adapters in a predictable way.
worker_processes 1;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Omit $args (the query string). The MCP token travels as the
    # userToken query parameter when the client uses it, so it must not reach the log.
    log_format balance '$remote_addr "$request_method $uri" $status upstream=$upstream_addr time=$request_time';

    # The shipped compose runs the adapters as containers, so the names below
    # need no change. For adapters on the host, do not use host.docker.internal:
    # on Docker Desktop it also resolves to an IPv6 address that does not answer.
    # Use the IPv4 address, or `resolver 127.0.0.11 ipv6=off;` with a variable upstream.
    upstream penpot_mcp {
        # Round robin is the default. Do not add ip_hash or sticky cookies:
        # the adapters share their state through Redis.
        #
        # nginx open source has no active health checks. Passive checks
        # only: after 2 failures a server is skipped for 10 seconds.
        # /healthz is probed by the compose healthchecks and by the test
        # steps in README.md.
        server penpot-mcp-1:4401 max_fails=2 fail_timeout=10s;
        server penpot-mcp-2:4401 max_fails=2 fail_timeout=10s;

        # Idle connections kept open to the adapters. Needs HTTP/1.1 and an
        # empty Connection header in the location below.
        keepalive 32;
        # Close idle upstream connections at 60 s, before the adapter closes
        # them (default 65 s, PENPOT_MCP_KEEPALIVE_S). Reusing a closed one gives 502.
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    server {
        listen 8080;

        # Match PENPOT_MCP_MAX_BODY_MB (default 32).
        client_max_body_size 32m;

        # The balancer's own health check. It does not reach an adapter.
        location = /lb-healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            access_log /dev/stdout balance;

            proxy_pass http://penpot_mcp;
            proxy_http_version 1.1;

            # Forwarded by default. Kept explicit so the reader sees it.
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            # Keep X-Forwarded-For and X-Real-IP. The adapter's /metrics check
            # treats any forwarding header as a client that is not on the
            # loopback, so the adapter knows the caller was proxied.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keeps the upstream connections open for reuse (keepalive above).
            proxy_set_header Connection "";

            # MCP streamable HTTP can answer with SSE. Pass each event on at once.
            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 10s;
            # SSE streams can sit idle for a long time, so the timeouts are 15 minutes.
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
